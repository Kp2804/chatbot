<body>
  <div id="root"></div>
    <!-- Chatbot Widget -->
  <script>
    (function() {
      const chatbotId = 'd5d27611-966e-49f0-9bcc-e863a6ba2320';
      const possibleUrls = [
          `${window.location.protocol}//${window.location.hostname}:3001`,
          `${window.location.protocol}//${window.location.hostname}:3000`,
          `${window.location.protocol}//${window.location.hostname}${window.location.port ? ':' + window.location.port : ''}`,
          'http://localhost:3001',
          'http://localhost:3000',
      ];
      function loadWidget(appUrl) {
        const script = document.createElement('script');
        script.src = `${appUrl}/chatbot-widget.js`;
        script.dataset.appUrl = appUrl;
        script.dataset.chatbotId = chatbotId;
        script.dataset.width = 'min(420px, 50vw)';
        script.dataset.height = 'min(80vh, 720px)';
        script.onerror = () => {
          const nextUrl = possibleUrls[possibleUrls.indexOf(appUrl) + 1];
          if (nextUrl) loadWidget(nextUrl);
        };
        document.body.appendChild(script);
      }
      if (possibleUrls.length > 0) loadWidget(possibleUrls[0]);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
