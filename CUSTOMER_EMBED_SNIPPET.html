<!-- Chatbot Widget Embed Code -->
<!-- Paste this code before the </body> tag on your website -->

<!-- Basic Usage (auto-detects user name from page elements) -->
<script
  src="https://your-domain.com/chatbot-widget.js"
  data-app-url="https://your-domain.com"
  data-chatbot-id="YOUR_CHATBOT_ID"
  data-width="360px"
  data-height="560px"
></script>

<!-- With User Name (personalized responses) -->
<script>
  // Example: Get user name from your site
  const currentUser = "John Smith"; // Replace with your user's name
</script>
<script
  src="https://your-domain.com/chatbot-widget.js"
  data-app-url="https://your-domain.com"
  data-chatbot-id="YOUR_CHATBOT_ID"
  data-user-name="John Smith"
  data-width="360px"
  data-height="560px"
></script>

<!-- Dynamic User Name Example -->
<script>
  // If you have user data in JavaScript
  const userName = document.querySelector('.user-profile')?.textContent || 'Guest';
  
  // Create and append script dynamically
  const script = document.createElement('script');
  script.src = 'https://your-domain.com/chatbot-widget.js';
  script.setAttribute('data-app-url', 'https://your-domain.com');
  script.setAttribute('data-chatbot-id', 'YOUR_CHATBOT_ID');
  script.setAttribute('data-user-name', userName);
  script.setAttribute('data-width', '360px');
  script.setAttribute('data-height', '560px');
  document.body.appendChild(script);
</script>

<!-- Auto-Detection -->
<!-- The widget automatically looks for user names in these elements: -->
<!-- - .user-name, .username, #user-name -->
<!-- - .profile-name, .account-name -->
<!-- - [data-user-name], [data-username] -->
<!-- If found, it will use the name automatically! -->
